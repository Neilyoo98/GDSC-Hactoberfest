<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Kept: the public record of promises</title>
  <desc id="d">A promise from the news becomes a yes-or-no market with a deadline; people back Kept or Broken with test USDC; the result settles on Solana.</desc>
  <rect width="1200" height="420" fill="#f6f4ee"/>
  <line x1="48" y1="56" x2="1152" y2="56" stroke="#18201d" stroke-width="2"/>
  <text x="48" y="40" font-family="Georgia, serif" font-size="26" font-weight="600" fill="#18201d">kept<tspan fill="#1d6b47">.</tspan></text>
  <text x="1152" y="40" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#5d6762">solana devnet · test tokens only</text>

  <text x="48" y="140" font-family="Georgia, serif" font-size="46" fill="#18201d">Did they keep</text>
  <text x="48" y="196" font-family="Georgia, serif" font-size="46" fill="#18201d">their promise?</text>
  <text x="48" y="246" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#18201d">Paste a promise from the news. AI makes it a yes-or-no</text>
  <text x="48" y="272" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#18201d">question with a deadline. Back <tspan fill="#1d6b47" font-weight="700">Kept</tspan> or <tspan fill="#a33a2c" font-weight="700">Broken</tspan>.</text>
  <text x="48" y="298" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#18201d">The result settles on Solana for anyone to check.</text>

  <g transform="translate(640 92)">
    <rect width="512" height="264" fill="#fffdf8" stroke="#dcd7cb"/>
    <text x="24" y="38" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#5d6762">Devendra Fadnavis</text>
    <rect x="164" y="24" width="40" height="20" fill="none" stroke="#1f5f45"/>
    <text x="184" y="38" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1f5f45">Open</text>
    <text x="24" y="76" font-family="Georgia, serif" font-size="20" fill="#18201d">“Complete the Sewri–Worli Elevated</text>
    <text x="24" y="102" font-family="Georgia, serif" font-size="20" fill="#18201d">Corridor before May 31, 2027.”</text>
    <text x="24" y="132" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5d6762">due May 30, 2027 · source sha256 b6e58003…</text>
    <line x1="24" y1="152" x2="488" y2="152" stroke="#dcd7cb"/>
    <text x="24" y="186" font-family="ui-monospace, Menlo, monospace" font-size="26" fill="#1d6b47">62%</text>
    <text x="88" y="186" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#5d6762">kept</text>
    <text x="488" y="186" text-anchor="end" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#5d6762">185 tUSDC staked</text>
    <rect x="24" y="200" width="464" height="6" fill="#a33a2c"/>
    <rect x="24" y="200" width="288" height="6" fill="#1d6b47"/>
    <text x="24" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18201d">✓ Kept</text>
    <text x="96" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#18201d">✕ Broken</text>
    <text x="488" y="240" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1f5f45">Share on X →</text>
  </g>

  <line x1="48" y1="388" x2="1152" y2="388" stroke="#dcd7cb"/>
  <text x="48" y="410" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5d6762">AI drafts → people predict → AI resolves with sources → challenge → 3-person council → program pays winners</text>
</svg>
